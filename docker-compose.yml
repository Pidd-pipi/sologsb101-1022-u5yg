# 顶层层名兜底：避免中文目录名导致 compose 项目名为空
name: gbincense

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-gbincense}-frontend:latest
    container_name: ${COMPOSE_PROJECT_NAME:-gbincense}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-22822}:80"
    environment:
      - TZ=Asia/Shanghai
    # 纯前端应用：数据只存浏览器本地，无数据库服务、不挂载命名卷
